<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <title>Calcolatore Primogems</title>
    <link rel="stylesheet" href="destini.css" />
</head>
<body>
    <h1>Calcolatore Primogems</h1>

    <div id="topContainer">
        <div class="date-section">
            <div class="control-group">
                <label for="dataInizio">📅 Inizio:</label>
                <input type="date" id="dataInizio" onchange="aggiornaDaData('dataInizio', 'selectInizio')" />
                <span class="divider-text">oppure</span>
                <select id="selectInizio" onchange="aggiornaDaSelect('selectInizio', 'dataInizio')"></select>
            </div>

            <div class="control-group">
                <label for="dataTarget">📅 Data fine:</label>
                <input type="date" id="dataTarget" onchange="aggiornaDaData('dataTarget', 'selectFine')" />
                <span class="divider-text">oppure</span>
                <select id="selectFine" onchange="aggiornaDaSelect('selectFine', 'dataTarget')"></select>
                <button type="button" class="btn-subtle" onclick="impostaFineFase()">Fine fase</button>
            </div>
        </div>

        <table id="tabellaPatch">
            <thead>
                <tr>
                    <th>Patch</th>
                    <th>Fase 1 inizio</th>
                    <th>Fase 2 inizio</th>
                </tr>
            </thead>
            <tbody>
                <!-- Riempito da JS -->
            </tbody>
        </table>
    </div>

    <div id="riepilogoPatch"></div>
    <div id="risultato"></div>

    <div id="extraInputs">
        <div>
            <div class="inputs-row">
                <label for="destiniPregressi">
                    ✨ Destini pregressi:
                    <input type="number" id="destiniPregressi" min="0" value="0" onchange="aggiornaCalcolo()" />
                </label>
                <label for="destiniExtra">
                    📦 Destini extra:
                    <input type="number" id="destiniExtra" value="0" min="0" onchange="aggiornaCalcolo()" />
                </label>
            </div>
            <div>
                <label for="primoExtra">
                    💎 Primogem extra:
                    <input type="number" id="primoExtra" value="0" min="0" onchange="aggiornaCalcolo()" />
                </label>
                <label for="pity">
                    🎯 Pity:
                    <input type="number" id="pity" min="0" value="0" onchange="aggiornaCalcolo()" />
                </label>
            </div>
        </div>
    </div>

    <div id="totaleGenerale"></div>

    <div id="simulazioneContainer">
        <h2>Simulazione Pull 5★</h2>

        <div class="sim-controls">
            <div>
                <label for="simPersonaggi">
                    🎯 Personaggi desiderati:
                    <input type="number" id="simPersonaggi" value="0" min="0" />
                </label>

                <label for="simArmi">
                    ⚔️ Armi desiderate:
                    <input type="number" id="simArmi" value="0" min="0" />
                </label>
            </div>
            <div>
                <label for="numSim">
                    🔁 Numero simulazioni:
                    <input type="number" id="numSim" value="1000" min="100" step="100" />
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" id="primoGarantito" />
                    🎯 Personaggio garantito
                </label>
            </div>
                <button type="button" onclick="simulaPull()">Simula</button>
        </div>

        <!-- Risultati generali -->
        <div id="risultatoPersonaggi"></div>
        <div id="risultatoArmi"></div>

        <!-- Tabella classi interattiva -->
        <div id="analisiDestini5Star"></div>

        <!-- Dettaglio armi filtrate -->
        <div id="analisiArmiFiltrate"></div>
    </div>

    <script src="fontiPrimo.js"></script>
    <script src="destini.js"></script>

    <script>
        window.addEventListener("load", () => {
            const oggi = new Date();
            const formatted = oggi.toISOString().split('T')[0];
            const dataInizio = document.getElementById("dataInizio");
            if (dataInizio) dataInizio.value = formatted;
        });
    </script>
</body>
</html>
